services:
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: homepage-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      INFO: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
    networks:
      - homepage-internal

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      HOMEPAGE_ALLOWED_HOSTS: homepi.local:3000,homepi:3000,100.72.110.114:3000
      PUID: ${PUID}
      PGID: ${PGID}
    volumes:
      - /srv/appdata/homepage:/app/config
    networks:
      - homepage-internal
    depends_on:
      - socket-proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  homepage-internal:
