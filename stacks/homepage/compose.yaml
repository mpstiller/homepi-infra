services:
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.6
    x-arcane:
      updater:
        strategy: tag
        constraint: '3.4.x'
        tag-pattern: '(?P<version>[0-9]+\.[0-9]+\.[0-9]+)'
    container_name: homepage-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      INFO: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
    networks:
      - homepage-internal

  operations-status:
    image: python:3.13.17-alpine3.24
    x-arcane:
      updater:
        strategy: tag
        constraint: '3.13.x'
        tag-pattern: '(?P<version>[0-9]+\.[0-9]+\.[0-9]+)-alpine3\.24'
    container_name: homepage-operations-status
    restart: unless-stopped
    user: "65534:65534"
    command: ["python3", "-B", "/app/homepi-status", "serve", "--state", "/data/status.json"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    pids_limit: 32
    cpus: 0.25
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/audio.json', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - /usr/local/sbin/homepi-status:/app/homepi-status:ro
      - /srv/appdata/homepi-status:/data:ro
    networks:
      - homepage-internal

  homepage:
    image: ghcr.io/gethomepage/homepage:v2.4.0
    x-arcane:
      updater:
        strategy: tag
        constraint: '2.4.x'
        tag-pattern: 'v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)'
    container_name: homepage
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      HOMEPAGE_ALLOWED_HOSTS: homepi.local:3000,homepi:3000,100.72.110.114:3000
      PUID: ${PUID}
      PGID: ${PGID}
    volumes:
      - /srv/appdata/homepage:/app/config
    networks:
      - homepage-internal
    depends_on:
      - socket-proxy
      - operations-status
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  homepage-internal:
