services:

  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${PROTON_WIREGUARD_PRIVATE_KEY}
      SERVER_COUNTRIES: Germany
      PORT_FORWARD_ONLY: "on"
      VPN_PORT_FORWARDING: "on"
      TZ: ${TZ}

      VPN_PORT_FORWARDING_UP_COMMAND: >-
        /bin/sh -c 'i=0; until wget -qO- http://127.0.0.1:8080/api/v2/app/version >/dev/null 2>&1; do i=$$((i+1)); if [ "$$i" -ge 30 ]; then echo "qBittorrent WebUI not ready"; exit 1; fi; sleep 2; done; wget -qO- --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8080/api/v2/app/setPreferences >/dev/null 2>&1 || true; prefs=$$(wget -qO- http://127.0.0.1:8080/api/v2/app/preferences); echo "$$prefs" | grep -q "\"listen_port\":{{PORT}}" && echo "$$prefs" | grep -q "\"current_network_interface\":\"{{VPN_INTERFACE}}\"" && echo "qBittorrent successfully configured: port {{PORT}} on {{VPN_INTERFACE}}"'

      VPN_PORT_FORWARDING_DOWN_COMMAND: >-
        /bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:8080/api/v2/app/setPreferences'

    volumes:
      - /srv/appdata/gluetun:/gluetun
    ports:
      - "8080:8080"
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: 8080
    volumes:
      - /srv/appdata/qbittorrent:/config
      - /srv/data:/data
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - /srv/appdata/sonarr:/config
      - /srv/data:/data
    ports:
      - "8989:8989"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - /srv/appdata/radarr:/config
      - /srv/data:/data
    ports:
      - "7878:7878"
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - /srv/appdata/prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    environment:
      TZ: ${TZ}
      PORT: 5055
      LOG_LEVEL: info
    volumes:
      - /srv/appdata/seerr:/app/config
    ports:
      - "5055:5055"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      LOG_LEVEL: info
      LOG_HTML: "false"
      TZ: ${TZ}
    ports:
      - "127.0.0.1:8191:8191"
    restart: unless-stopped
